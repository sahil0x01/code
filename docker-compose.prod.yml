name: nullfuse-code-prod

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
    image: ${APP_IMAGE:-nullfuse-code:local}
    env_file: .env.production
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  migrate:
    build:
      context: .
      target: migrate
    image: ${MIGRATE_IMAGE:-nullfuse-code-migrate:local}
    env_file: .env.production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy

  postgres:
    profiles: ["db"]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nullfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nullfuse
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullfuse -d nullfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
